name: propmatch_mobile
description: "PropMatch AI - Mobile Application for Tenants and Landlords"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Dependency Injection
  get_it: ^8.3.0

  # State Management & Routing
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^14.8.1

  # Networking & Cache
  dio: ^5.7.0
  shared_preferences: ^2.3.3

  # Localization
  easy_localization: ^3.0.7
  intl: any

  # Design, UI & Typography
  google_fonts: ^6.3.3
  flutter_lucide: ^1.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8

  # Hardware & Media
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  flutter_pdfview: ^1.3.4
  audioplayers: ^6.1.1
  record: ^7.1.1
  share_plus: ^10.1.4
  webview_flutter: ^4.10.0
  flutter_markdown: ^0.7.6+1

  # Real-time WebSockets
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/

flutter_gen:
  output: lib/core/gen/
  line_length: 80
